<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Games</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0b0e14;
  --surface: #131b28;
  --surface-2: #1a212e;
  --surface-3: #1d2534;
  --input: #0e131c;
  --text: #c6d4e3;
  --text-light: #eef4ff;
  --muted: #8a9fc3;
  --dim: #5a6b82;
  --border: #2a3445;
  --border-strong: #2e3a4e;
  --accent: #1d6bf3;
  --accent-soft: #5f9eff;
  --accent-glow: rgba(29,107,243,.55);
}

body {
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  height: 100vh;
  width: 100vw;
}

/* ===== FLOATING ICONS ===== */
.floating-icons { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.floating-icons svg {
  position: absolute; opacity: .05; fill: #7aa9ff;
  animation: floatIcon 18s infinite ease-in-out alternate;
  filter: drop-shadow(0 0 6px #1d6bf3);
}
@keyframes floatIcon {
  0% { transform: translate(0,0) rotate(0deg) scale(1); }
  100% { transform: translate(30px,-40px) rotate(8deg) scale(1.1); }
}

/* ===== START SCREEN (MATH GAMES) ===== */
.start-screen {
  position: fixed; inset: 0; z-index: 9999;
  background: radial-gradient(circle at 30% 30%, #1a0f1e, #070609 80%);
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  transition: transform .7s cubic-bezier(.23,1,.32,1);
  border-bottom: 4px solid #ff3d9f;
  transform: translateY(0);
  pointer-events: auto;
  overflow-y: auto;
  padding: 20px;
}
.start-screen.slide-up { transform: translateY(-100%); pointer-events: none; }

.start-content {
  text-align: center; max-width: 700px; width: 100%;
  padding: 2.5rem;
  background: #1a0f1eaa;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-radius: 40px; border: 3px solid rgba(255,255,255,.12);
  box-shadow: 0 25px 40px -10px black, inset 0 0 40px #ff3d9f15;
}
.start-logo-wrap { position: relative; width: 120px; height: 120px; margin: 0 auto 1rem; display: grid; place-items: center; }
.start-logo {
  width: 84px; height: 84px; object-fit: contain; position: relative; z-index: 2;
  filter: drop-shadow(0 18px 32px rgba(255,35,145,.3));
  animation: heroFloat 4s ease-in-out infinite;
}
@keyframes heroFloat {
  0%,100% { transform: translateY(0) rotate(-2deg); }
  50% { transform: translateY(-10px) rotate(2deg); }
}
.hero-orbit {
  position: absolute; border: 1px solid rgba(255,92,184,.24);
  border-radius: 50%; inset: 8px; animation: spin 9s linear infinite;
}
.orbit-two { inset: 25px; border-color: rgba(147,73,255,.25); animation-direction: reverse; animation-duration: 13s; }
@keyframes spin { to { transform: rotate(360deg); } }

.start-content h1 {
  font-size: clamp(2.5rem, 8vw, 4rem);
  font-weight: 950; letter-spacing: -.04em; line-height: .95;
  background: linear-gradient(110deg, #fff 5%, #ffb9dd 38%, #ff4fa9 58%, #9e67ff 90%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  margin-bottom: .4rem;
}
.start-sub {
  font-size: 1rem; font-weight: 400; color: #9aafcc;
  margin-bottom: 2rem; letter-spacing: 4px; text-transform: uppercase;
}
.start-btn {
  background: #ff3d9f; border: none; color: #fff;
  font-size: 1.8rem; font-weight: 700; padding: 1rem 4rem;
  border-radius: 100px; cursor: pointer;
  box-shadow: 0 10px 0 #8a0d4a, 0 20px 40px #00000080;
  transition: all .1s ease; letter-spacing: 3px; text-transform: uppercase;
  display: inline-flex; align-items: center; gap: 15px;
  border: 2px solid rgba(255,255,255,.25);
}
.start-btn:active { transform: translateY(5px); box-shadow: 0 5px 0 #8a0d4a, 0 15px 30px #00000080; }
.start-btn:hover { background: #ff5aab; box-shadow: 0 10px 0 #8a0d4a, 0 25px 50px #ff3d9faa; }

/* ===== LIVE STATS ===== */
.live-stats { display: flex; gap: 1rem; margin-top: 2rem; justify-content: center; flex-wrap: wrap; }
.stat-box {
  background: #0d0a0fcc; border: 2px solid rgba(255,61,159,.3);
  border-radius: 20px; padding: .8rem 1.4rem; min-width: 130px;
  backdrop-filter: blur(6px);
}
.stat-label { font-size: .65rem; text-transform: uppercase; letter-spacing: 2px; color: #9aafcc; font-weight: 700; }
.stat-value { font-size: 1.7rem; font-weight: 800; color: #ffb9dd; text-shadow: 0 0 15px #ff3d9f; font-variant-numeric: tabular-nums; }

/* ===== MAIN GUI (STEAM) ===== */
.main-gui {
  position: relative; z-index: 10;
  width: 100%; height: 100vh;
  background: var(--bg);
  display: flex; flex-direction: column;
  opacity: 0; pointer-events: none;
  transition: opacity .5s ease .3s;
}
.main-gui.active { opacity: 1; pointer-events: auto; }

/* ----- TOP BAR (STEAM) ----- */
.top-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: .75rem 1.5rem;
  background: rgba(14,19,28,.7);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 3px solid var(--border);
  box-shadow: 0 4px 20px rgba(0,0,0,.33);
  z-index: 20;
}
.logo-area { display: flex; align-items: center; gap: 12px; }
.logo-icon {
  font-size: 2rem; color: var(--accent);
  filter: drop-shadow(0 0 10px var(--accent));
}
.logo-text {
  font-weight: 800; font-size: 1.7rem; letter-spacing: 3px;
  background: linear-gradient(135deg, #fff, #9bb9ff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.top-actions { display: flex; gap: 1.5rem; color: var(--text); font-size: 1.2rem; align-items: center; }
.top-actions i { cursor: pointer; transition: all .2s; padding: 8px; border-radius: 12px; }
.top-actions i:hover { color: #fff; background: rgba(29,107,243,.19); transform: scale(1.1); }

/* ===== NOTIFICATION ===== */
.notif-wrap { position: relative; }
.notif-badge {
  position: absolute; top: -4px; right: -4px;
  background: var(--accent); color: #fff; border-radius: 50%;
  width: 18px; height: 18px; font-size: .65rem;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800;
}
.notif-popup {
  position: absolute; top: 50px; right: 0;
  background: var(--surface-2); border: 2px solid var(--accent);
  border-radius: 18px; padding: 1.1rem 1.3rem;
  width: 320px; max-width: 90vw;
  box-shadow: 0 20px 50px rgba(0,0,0,.67);
  display: none; z-index: 100;
  animation: slideIn .25s ease;
}
.notif-popup.show { display: block; }
@keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
.notif-popup .close-n { position: absolute; top: 6px; right: 12px; color: var(--dim); cursor: pointer; font-size: 1.2rem; }
.notif-popup p { color: var(--text-light); font-size: .9rem; line-height: 1.5; }
.notif-popup .notif-date { color: var(--accent-soft); font-size: .75rem; font-weight: 700; letter-spacing: 1px; margin-bottom: .4rem; }

/* ===== LAYOUT (STEAM) ===== */
.main-layout { display: flex; flex: 1; overflow: hidden; }

.sidebar {
  width: 280px; background: var(--surface-2);
  border-right: 2px solid var(--border);
  display: flex; flex-direction: column;
  padding: 1.5rem 1rem; gap: 2rem; overflow-y: auto;
  box-shadow: 6px 0 20px rgba(0,0,0,.25);
}
.search-section {
  background: var(--input); border-radius: 40px;
  padding: .5rem 1rem; display: flex; align-items: center;
  border: 2px solid var(--border-strong); transition: border .2s;
}
.search-section:focus-within { border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
.search-section i { color: #7b8ba3; font-size: 1.2rem; }
.search-section input {
  background: transparent; border: none; color: #fff;
  font-size: 1rem; padding: .8rem .6rem; width: 100%; outline: none;
}
.search-section input::placeholder { color: var(--dim); font-weight: 300; letter-spacing: .5px; }

.nav-links { display: flex; flex-direction: column; gap: 6px; }
.nav-item {
  display: flex; align-items: center; gap: 14px;
  padding: .9rem 1.2rem; border-radius: 20px;
  color: #b0c1da; font-weight: 500; transition: all .2s;
  cursor: pointer; border: 2px solid transparent;
}
.nav-item i { width: 24px; font-size: 1.3rem; color: #6d84a8; }
.nav-item:hover { background: rgba(29,107,243,.13); border-color: rgba(29,107,243,.44); color: #fff; }
.nav-item.active { background: rgba(29,107,243,.19); border: 2px solid var(--accent); color: #fff; box-shadow: 0 0 20px var(--accent-glow); }
.nav-item.active i { color: var(--accent-soft); }

.divider { height: 2px; background: var(--border); margin: .5rem 0; border-radius: 2px; }
.category-tag { font-size: .85rem; text-transform: uppercase; letter-spacing: 2px; color: #697b96; padding-left: .8rem; font-weight: 600; }

/* ===== CONTENT (STEAM) ===== */
.content { flex: 1; overflow-y: auto; padding: 2rem 2rem 3rem; background: #0b0f16; display: flex; flex-direction: column; gap: 1.2rem; }
.section-title {
  display: flex; align-items: center; gap: 15px;
  font-size: 1.6rem; font-weight: 700; letter-spacing: 1px;
  color: #d6e5ff; margin-bottom: .5rem;
}
.section-title i { color: var(--accent); }

/* ===== GAME BANNER ===== */
.game-banner {
  position: relative; width: 100%; height: 150px;
  border-radius: 20px; overflow: hidden; cursor: pointer;
  border: 2px solid var(--border);
  transition: transform .25s ease, border-color .25s, box-shadow .25s;
  box-shadow: 0 10px 25px -5px black;
  background: var(--surface);
}
.game-banner:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 20px 35px -10px var(--accent-glow); }
.game-banner-bg {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  filter: blur(10px) brightness(.5);
  transform: scale(1.1);
}
.game-banner-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(11,14,20,.15) 0%, rgba(11,14,20,.75) 100%);
}
.game-banner-content {
  position: relative; z-index: 2; height: 100%;
  display: flex; align-items: center; justify-content: center;
  padding: 0 2rem;
}
.game-banner-title {
  font-size: 2rem; font-weight: 800; color: #fff;
  text-shadow: 0 0 20px var(--accent-glow), 0 4px 10px black;
  letter-spacing: 2px; text-transform: uppercase; text-align: center;
}
.game-banner-meta {
  position: absolute; bottom: 10px; right: 15px;
  font-size: .7rem; color: rgba(255,255,255,.5);
  letter-spacing: 1px; z-index: 2;
}

/* ===== GAME PREVIEW ===== */
.game-preview {
  position: fixed; inset: 0; z-index: 10000;
  background: rgba(7,6,9,.98);
  display: none; flex-direction: column;
  opacity: 0; transition: opacity .3s ease;
}
.game-preview.show { display: flex; opacity: 1; }
.preview-top {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1rem 1.5rem;
  background: var(--surface-2); border-bottom: 2px solid var(--border);
}
.preview-back {
  background: transparent; border: 2px solid var(--accent); color: var(--accent-soft);
  padding: .6rem 1.2rem; border-radius: 12px; cursor: pointer;
  font-weight: 700; font-size: 1rem;
  display: flex; align-items: center; gap: 8px; transition: all .2s;
}
.preview-back:hover { background: var(--accent); color: #fff; }
.preview-title { font-size: 1.3rem; font-weight: 800; letter-spacing: 2px; color: #fff; }
.preview-controls { display: flex; gap: .8rem; }
.preview-ctrl {
  background: var(--surface); border: 2px solid var(--border-strong);
  color: var(--accent-soft); width: 42px; height: 42px;
  border-radius: 12px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem; transition: all .2s;
}
.preview-ctrl:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.preview-stage {
  flex: 1; margin: 1rem 1.5rem 1.5rem;
  border-radius: 20px; overflow: hidden;
  border: 3px solid var(--accent); background: #000;
  box-shadow: 0 0 40px var(--accent-glow);
}
.preview-stage iframe { width: 100%; height: 100%; border: none; background: #000; }

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track { background: #0a0e14; }
::-webkit-scrollbar-thumb { background: #2a3b55; border-radius: 20px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

@media (max-width: 700px) {
  .sidebar { display: none; }
  .content { padding: 1.5rem 1rem; }
  .game-banner { height: 110px; }
  .game-banner-title { font-size: 1.3rem; }
  .logo-text { font-size: 1.2rem; }
}
</style>
</head>
<body>

<div class="floating-icons">
  <svg width="90" height="90" viewBox="0 0 24 24" style="top:12%;left:5%;animation-duration:24s;"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>

  <svg width="70" height="70" viewBox="0 0 24 24" style="top:40%;left:90%;animation-duration:20s;"><path d="M21 6h-2v2h-2V6h-2V4h2V2h2v2h2v2zm-10 3c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zm0 4c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>

<!-- ===== START SCREEN (MATH GAMES) ===== -->

  <div class="start-content">

      <div class="hero-orbit orbit-one"></div>

<script>
(function() {
  // ================================================================
  // GAME LIST — Add new games at the BOTTOM (they show first in New Releases)
  // ================================================================
  const GAMES = [
    { name: 'Among Us', file: 'among-us.html', img: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQFZ7tdplHROafc_A5tVU2caO0i2ZXpoEL_OORMMg-9Bg&s=10' },
  ];

  // ================================================================
  // REAL STATS via CounterAPI
  // ================================================================
  const COUNTER_NS = 'mathgames-site';
  const COUNTER_API = 'https://counterapi.com/api';

  function ukDayKey() {
    const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
    const p = Object.fromEntries(parts.filter(x => x.type !== 'literal').map(x => [x.type, x.value]));
    return `${p.year}-${p.month}-${p.day}`;
  }

  function counterURL(action, key, params = {}, readOnly = false) {
    const url = new URL(`${COUNTER_API}/${encodeURIComponent(COUNTER_NS)}/${encodeURIComponent(action)}/${encodeURIComponent(key)}`);
    if (readOnly) url.searchParams.set('readOnly', 'true');
    for (const [k, v] of Object.entries(params || {})) if (v != null) url.searchParams.set(k, String(v));
    url.searchParams.set('_', `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`);
    return url.toString();
  }

  async function counterHit(action, key, params = {}) {
    const r = await fetch(counterURL(action, key, params, false), { method: 'GET', cache: 'no-store', mode: 'cors', keepalive: true });
    if (!r.ok) throw new Error('write failed ' + r.status);
    return r.json().catch(() => ({ value: 0 }));
  }

  async function counterRead(action, key, params = {}) {
    const r = await fetch(counterURL(action, key, params, true), { method: 'GET', cache: 'no-store', mode: 'cors' });
    if (r.status === 404) return 0;
    if (!r.ok) throw new Error('read failed ' + r.status);
    const body = await r.json();
    const v = Number(body && body.value);
    return Number.isFinite(v) ? v : 0;
  }

  function randomId() {
    try { if (crypto && crypto.randomUUID) return crypto.randomUUID(); } catch {}
    return 'mg-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2) + '-' + Math.random().toString(36).slice(2);
  }

  function getTrackIds() {
    let visitorId, sessionId;
    try { visitorId = localStorage.getItem('mg-visitor-id'); if (!visitorId) { visitorId = randomId(); localStorage.setItem('mg-visitor-id', visitorId); } } catch { visitorId = randomId(); }
    try { sessionId = sessionStorage.getItem('mg-session-id'); if (!sessionId) { sessionId = randomId(); sessionStorage.setItem('mg-session-id', sessionId); } } catch { sessionId = randomId(); }
    return { visitorId, sessionId };
  }

  let currentDay = '';
  let peakCache = 0;
  let totalCache = 0;
  let lastTotalRefresh = 0;
  let lastPeakRefresh = 0;
  let lastObservedActive = -1;
  let inFlight = false;
  const ids = getTrackIds();
  let pageWasTracked = false;

  async function visitOnceToday(day) {
    const key = `mg-visit-${day}`;
    try { if (localStorage.getItem(key) === ids.visitorId) return; } catch {}
    await counterHit('view', `day-${day}`, { userId: ids.visitorId });
    try { localStorage.setItem(key, ids.visitorId); } catch {}
  }

  async function raisePeak(day, active) {
    const key = `day-${day}`;
    let peak = await counterRead('peak', key);
    if (active <= peak) return peak;
    await new Promise(r => setTimeout(r, 250 + Math.random() * 650));
    peak = await counterRead('peak', key);
    if (active <= peak) return peak;
    const diff = Math.min(200, Math.max(0, Math.ceil(active - peak)));
    if (diff) {
      await Promise.all(Array.from({ length: diff }, () => counterHit('peak', key, { userId: ids.visitorId })));
      peak = await counterRead('peak', key);
    }
    return peak;
  }

  async function syncStats() {
    if (inFlight) return;
    inFlight = true;
    try {
      const day = ukDayKey();
      const newDay = day !== currentDay;
      if (newDay) {
        await visitOnceToday(day);
        currentDay = day;
        lastTotalRefresh = 0;
        lastPeakRefresh = 0;
        lastObservedActive = -1;
        totalCache = 0;
        peakCache = 0;
      }
      const m = location.pathname.match(/\/games\/([^/]+)\.html?$/i) || location.pathname.match(/\/play\/([^/]+)\.html?$/i);
      if (m && !pageWasTracked) {
        const slug = decodeURIComponent(m[1]).toLowerCase();
        await counterHit('play', `${day}-${slug}`, { userId: ids.visitorId });
        pageWasTracked = true;
      }
      await counterHit('presence', 'all', { userId: ids.visitorId });
      const active = await counterRead('presence', 'all', { timeline: '2m', unique: 'true' });
      const now = Date.now();
      const tasks = [];
      if (!lastTotalRefresh || now - lastTotalRefresh > 60000) {
        tasks.push(counterRead('view', `day-${day}`, { unique: 'true' }).then(v => { totalCache = v; lastTotalRefresh = Date.now(); }));
      }
      if (newDay || !lastPeakRefresh || now - lastPeakRefresh > 90000 || active > lastObservedActive) {
        tasks.push(raisePeak(day, active).then(v => { peakCache = v; lastPeakRefresh = Date.now(); }));
      }
      await Promise.all(tasks);
      lastObservedActive = active;

      document.getElementById('statOnline').textContent = active;
      document.getElementById('statPeak').textContent = peakCache;
      document.getElementById('statVisits').textContent = totalCache;

      if (currentFilter === 'trending' || currentFilter === 'popular') {
        await renderContent();
      }
    } catch (e) {
      console.warn('Stats unavailable:', e);
      document.getElementById('statOnline').textContent = '—';
      document.getElementById('statPeak').textContent = '—';
      document.getElementById('statVisits').textContent = '—';
    } finally {
      inFlight = false;
    }
  }

  async function fetchPlayCounts(day) {
    const results = {};
    const batchSize = 6;
    for (let i = 0; i < GAMES.length; i += batchSize) {
      const batch = GAMES.slice(i, i + batchSize);
      await Promise.all(batch.map(async g => {
        const slug = g.file.replace(/\.html?$/i, '');
        try { results[slug] = await counterRead('play', `${day}-${slug}`); }
        catch { results[slug] = 0; }
      }));
    }
    return results;
  }

  let currentFilter = 'all';
  let playCountsCache = {};
  let playCountsDay = '';
  let playCountsFetchedAt = 0;

  const startScreen = document.getElementById('startScreen');
  const startBtn = document.getElementById('startBtn');
  const mainGui = document.getElementById('mainGui');
  const contentArea = document.getElementById('contentArea');
  const searchInput = document.getElementById('searchInput');
  const gamePreview = document.getElementById('gamePreview');
  const previewIframe = document.getElementById('previewIframe');
  const previewTitle = document.getElementById('previewTitle');

  startBtn.addEventListener('click', () => {
    gsap.to(startScreen, {
      y: '-100%', duration: .8, ease: 'power3.inOut',
      onStart: () => mainGui.classList.add('active'),
      onComplete: () => startScreen.classList.add('slide-up')
    });
    gsap.from('.top-bar', { opacity: 0, y: -20, duration: .6, delay: .3 });
    gsap.from('.sidebar', { opacity: 0, x: -40, duration: .6, delay: .4 });
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !startScreen.classList.contains('slide-up')) startBtn.click();
  });

  // Notification
  const notifBell = document.getElementById('notifBell');
  const notifPopup = document.getElementById('notifPopup');
  const notifClose = document.getElementById('notifClose');
  const notifBadge = document.getElementById('notifBadge');
  let notifRead = false;
  notifBell.addEventListener('click', () => {
    notifPopup.classList.toggle('show');
    if (!notifRead && notifPopup.classList.contains('show')) {
      notifRead = true;
      notifBadge.style.display = 'none';
    }
  });
  notifClose.addEventListener('click', () => notifPopup.classList.remove('show'));

  async function getGamesForFilter(filter, searchTerm) {
    let list = [...GAMES];
    if (searchTerm) {
      const q = searchTerm.toLowerCase();
      list = list.filter(g => g.name.toLowerCase().includes(q));
    }
    if (filter === 'new') {
      list = list.slice().reverse();
    } else if (filter === 'trending' || filter === 'popular') {
      const day = ukDayKey();
      const now = Date.now();
      if (playCountsDay !== day || now - playCountsFetchedAt > 60000) {
        playCountsCache = await fetchPlayCounts(day);
        playCountsDay = day;
        playCountsFetchedAt = now;
      }
      list = list.slice().sort((a, b) => {
        const sa = a.file.replace(/\.html?$/i, '');
        const sb = b.file.replace(/\.html?$/i, '');
        return (playCountsCache[sb] || 0) - (playCountsCache[sa] || 0);
      });
    }
    return list;
  }

  async function renderContent() {
    const searchTerm = searchInput.value.trim();
    const games = await getGamesForFilter(currentFilter, searchTerm);

    let title = '', icon = '';
    if (currentFilter === 'all') { title = 'ALL GAMES'; icon = 'fa-store'; }
    else if (currentFilter === 'new') { title = 'NEW RELEASES'; icon = 'fa-clock'; }
    else if (currentFilter === 'trending') { title = 'TRENDING NOW'; icon = 'fa-fire'; }
    else if (currentFilter === 'popular') { title = 'POPULAR'; icon = 'fa-star'; }

    let html = `<div class="section-title"><i class="fa-solid ${icon}"></i> ${title}</div>`;

    if (games.length === 0) {
      html += `<div style="color:#697b96;text-align:center;padding:3rem;font-size:1.2rem;">No games found.</div>`;
    } else {
      html += games.map(g => {
        const slug = g.file.replace(/\.html?$/i, '');
        const plays = playCountsCache[slug] || 0;
        const meta = (currentFilter === 'trending' || currentFilter === 'popular') && plays > 0
          ? `<div class="game-banner-meta">${plays} plays today</div>`
          : '';
        return `
          <div class="game-banner" data-file="${g.file}" data-name="${g.name}">
            <div class="game-banner-bg" style="background-image:url('${g.img}')"></div>
            <div class="game-banner-overlay"></div>
            <div class="game-banner-content">
              <div class="game-banner-title">${g.name}</div>
            </div>
            ${meta}
          </div>
        `;
      }).join('');
    }

    contentArea.innerHTML = html;
    contentArea.querySelectorAll('.game-banner').forEach(b => {
      b.addEventListener('click', () => openPreview(b.dataset.file, b.dataset.name));
    });
  }

  function openPreview(file, name) {
    previewIframe.src = 'games/' + file;
    previewTitle.textContent = name;
    gamePreview.classList.add('show');
    document.body.style.overflow = 'hidden';
  }
  function closePreview() {
    gamePreview.classList.remove('show');
    previewIframe.src = '';
    document.body.style.overflow = '';
  }
  document.getElementById('previewBack').addEventListener('click', closePreview);
  document.getElementById('previewReload').addEventListener('click', () => {
    if (previewIframe.src) previewIframe.src = previewIframe.src;
  });
  document.getElementById('previewFullscreen').addEventListener('click', () => {
    if (previewIframe.requestFullscreen) previewIframe.requestFullscreen();
    else if (previewIframe.webkitRequestFullscreen) previewIframe.webkitRequestFullscreen();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && gamePreview.classList.contains('show')) closePreview();
  });

  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', async () => {
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      item.classList.add('active');
      currentFilter = item.dataset.filter;
      await renderContent();
    });
  });

  searchInput.addEventListener('input', renderContent);

  (async function init() {
    await syncStats();
    await renderContent();
    setInterval(syncStats, 30000);
    window.addEventListener('pageshow', syncStats);
  })();
})();
</script>
</body>
</html>
